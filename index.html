<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electrifying Spiral Galaxy</title>
    <style>
        /* Reset and base styles */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #020108; /* Deepest cosmic black */
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }

        /* Make the canvas fill the entire screen */
        canvas {
            display: block;
        }

        /* Centered loading text with a neon pulse */
        .loading-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.5rem;
            letter-spacing: 12px;
            text-transform: uppercase;
            pointer-events: none; /* Allows clicking through the text */
            z-index: 10;
            animation: pulse-text 2s ease-in-out infinite alternate;
        }

        @keyframes pulse-text {
            0% { 
                opacity: 0.5; 
                text-shadow: 0 0 5px #00f3ff; 
            }
            100% { 
                opacity: 1; 
                text-shadow: 0 0 20px #00f3ff, 0 0 40px #b026ff; 
            }
        }
    </style>
</head>
<body>
    <div class="loading-text">SYSTEM ONLINE</div>
    
    <!-- The canvas where JavaScript will draw our galaxy -->
    <canvas id="galaxyCanvas"></canvas>

    <script>
        const canvas = document.getElementById('galaxyCanvas');
        const ctx = canvas.getContext('2d');
        
        // Size the canvas to the browser window
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particles = [];
        // Electrifying color palette: Neon Cyan, Deep Purple, Bright White, and Metallic Silver
        const colors = ['#00f3ff', '#b026ff', '#ffffff', '#e0e0e0']; 

        // Particle Class to generate individual stars
        class Particle {
            constructor(x, y, radius, color, angle, distance) {
                this.x = x;
                this.y = y;
                this.radius = radius;
                this.color = color;
                this.angle = angle;
                this.distance = distance;
                // Varying speeds for a realistic cosmic swirl
                this.speed = 0.001 + Math.random() * 0.002; 
            }

            update() {
                this.angle += this.speed;
                // Trigonometry to move particles in a circle based on their distance from center
                this.x = canvas.width / 2 + Math.cos(this.angle) * this.distance;
                this.y = canvas.height / 2 + Math.sin(this.angle) * this.distance;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2, false);
                ctx.fillStyle = this.color;
                // Add an intense glow effect to each star
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 12;
                ctx.fill();
                ctx.closePath();
            }
        }

        // Initialize the galaxy
        function init() {
            // Generate 1,000 particles
            for (let i = 0; i < 1000; i++) {
                const radius = Math.random() * 1.5;
                
                // Math to create a spiral galaxy shape
                const distance = Math.random() * (canvas.width > canvas.height ? canvas.width / 1.5 : canvas.height / 1.5);
                const angle = distance * 0.05 + Math.random() * Math.PI * 2;
                
                // Pick a random color from our array
                const color = colors[Math.floor(Math.random() * colors.length)];
                
                particles.push(new Particle(canvas.width / 2, canvas.height / 2, radius, color, angle, distance));
            }
        }

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            
            // Fill the background with a slightly transparent black to create a trailing effect
            ctx.fillStyle = 'rgba(2, 1, 8, 0.15)'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Update and draw every particle
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });
        }

        init();
        animate();

        // Ensure the canvas resizes perfectly if the user changes their window size
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            // Clear existing array and regenerate particles on resize to prevent distortion
            particles.length = 0; 
            init();
        });
    </script>
</body>
</html>
