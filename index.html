<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Hole - Interactive</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: grab;
        }
        canvas:active {
            cursor: grabbing;
        }
        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.4);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 14px;
            letter-spacing: 1px;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="info">website in progress... (Drag to rotate, scroll to zoom)</div>
    
    <!-- Import Maps Polyfill for ES Modules -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        // 1. IMPORT ORBIT CONTROLS
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- SCENE SETUP ---
        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        
        // Camera used just to render the flat shader plane
        const renderCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 10);
        renderCamera.position.z = 1;

        // 2. CREATE VIRTUAL CAMERA FOR CONTROLS
        const virtualCamera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        virtualCamera.position.set(0, 2, 7); // Start slightly above and pulled back

        // 3. ATTACH ORBIT CONTROLS
        const controls = new OrbitControls(virtualCamera, renderer.domElement);
        controls.enableDamping = true; // Adds smooth physics
        controls.dampingFactor = 0.05;
        controls.minDistance = 3.0;    // Prevent zooming inside the event horizon
        controls.maxDistance = 15.0;   // Prevent zooming too far out

        // --- SHADERS ---
        const vertexShader = `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = vec4(position, 1.0);
            }
        `;

        const fragmentShader = `
            uniform float u_time;
            uniform vec2 u_resolution;
            // 4. ADD NEW UNIFORMS FOR CAMERA DATA
            uniform vec3 u_cameraPos;
            uniform mat4 u_cameraMatrix;
            
            varying vec2 vUv;

            // Math & Procedural Noise Functions
            float hash(float n) { return fract(sin(n)*43758.5453123); }
            
            float noise(vec3 x) {
                vec3 p = floor(x);
                vec3 f = fract(x);
                f = f*f*(3.0-2.0*f);
                float n = p.x + p.y*57.0 + 113.0*p.z;
                return mix(
                    mix(mix(hash(n+0.0), hash(n+1.0),f.x), mix(hash(n+57.0), hash(n+58.0),f.x),f.y),
                    mix(mix(hash(n+113.0), hash(n+114.0),f.x), mix(hash(n+170.0), hash(n+171.0),f.x),f.y),
                f.z);
            }

            float fbm(vec3 p) {
                float f = 0.0;
                f += 0.5000*noise(p); p = p*2.02;
                f += 0.2500*noise(p); p = p*2.03;
                f += 0.1250*noise(p); p = p*2.01;
                f += 0.0625*noise(p);
                return f / 0.9375;
            }

            void main() {
                vec2 uv = (vUv - 0.5) * 2.0;
                uv.x *= u_resolution.x / u_resolution.y;

                // 5. APPLY VIRTUAL CAMERA MATRIX
                // Set ray origin to the virtual camera's position
                vec3 ro = u_cameraPos;
                
                // Three.js cameras look down the -Z axis. 
                // We create a local ray direction based on the screen UVs
                vec3 rdLocal = normalize(vec3(uv, -1.0));
                
                // Rotate the local ray direction using the camera's world matrix
                vec3 rd = normalize((u_cameraMatrix * vec4(rdLocal, 0.0)).xyz);

                // Black Hole Properties
                float mass = 0.5;
                float rs = 2.0 * mass; 
                
                vec3 p = ro;
                vec3 v = rd;
                float dt = 0.02; 
                
                vec3 col = vec3(0.0);
                float diskAccum = 0.0;
                
                // CORE RAYMARCHING LOOP
                for(int i = 0; i < 250; i++) {
                    float r = length(p);
                    
                    if(r < rs * 0.95) {
                        col *= 0.0;
                        break;
                    }
                    
                    if(r > 15.0) {
                        // The background starfield will naturally rotate correctly
                        // because 'v' is now tied to the camera matrix
                        float stars = pow(max(0.0, noise(v * 150.0)), 15.0) * 1.5;
                        stars += pow(max(0.0, noise(v * 250.0)), 20.0) * 0.8;
                        float galaxy = noise(v * 5.0) * 0.1;
                        col += vec3(stars) + vec3(galaxy * 0.5, galaxy * 0.7, galaxy);
                        break;
                    }
                    
                    vec3 gravityDir = -normalize(p);
                    vec3 force = gravityDir * (mass / (r * r));
                    
                    v = normalize(v + force * dt * 1.5); 
                    p += v * dt; 
                    
                    float diskThickness = 0.15;
                    if(abs(p.y) < diskThickness && r > rs * 1.2 && r < 5.0) {
                        float distToCenter = length(p.xz);
                        
                        float angle = atan(p.z, p.x);
                        float speed = sqrt(mass / distToCenter) * 1.5; 
                        angle -= u_time * speed * 0.5;
                        
                        vec3 diskPos = vec3(cos(angle)*distToCenter, 0.0, sin(angle)*distToCenter);
                        float n = fbm(diskPos * 3.5 - vec3(0.0, u_time*0.1, 0.0));
                        
                        float verticalFade = smoothstep(diskThickness, 0.0, abs(p.y));
                        float radialFade = smoothstep(5.0, 3.0, distToCenter) * smoothstep(rs*1.2, rs*2.0, distToCenter);
                        
                        vec3 tangent = normalize(vec3(-diskPos.z, 0.0, diskPos.x));
                        float doppler = max(0.0, 1.0 + dot(v, tangent) * 1.2);
                        
                        float density = n * verticalFade * radialFade * doppler;
                        diskAccum += max(0.0, density * dt * 2.5);
                    }
                    
                    dt = max(0.015, 0.02 * r);
                }
                
                vec3 hotColor = vec3(1.0, 0.7, 0.3);
                vec3 coolColor = vec3(0.8, 0.3, 0.1);
                vec3 finalDiskColor = mix(coolColor, hotColor, min(1.0, diskAccum * 0.5));
                
                col += finalDiskColor * diskAccum * 1.5;
                gl_FragColor = vec4(col, 1.0);
            }
        `;

        // --- MATERIAL & MESH ---
        // 6. INITIALIZE NEW UNIFORMS
        const uniforms = {
            u_time: { value: 0.0 },
            u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
            u_cameraPos: { value: new THREE.Vector3() },
            u_cameraMatrix: { value: new THREE.Matrix4() }
        };

        const material = new THREE.ShaderMaterial({
            vertexShader,
            fragmentShader,
            uniforms
        });

        const plane = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
        scene.add(plane);

        // --- POST-PROCESSING ---
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, renderCamera));

        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            1.2, 0.5, 0.6
        );
        composer.addPass(bloomPass);

        // --- ANIMATION LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            
            // Update OrbitControls physics
            controls.update(); 
            
            // 7. PASS LIVE CAMERA DATA TO SHADER
            uniforms.u_time.value = clock.getElapsedTime();
            uniforms.u_cameraPos.value.copy(virtualCamera.position);
            uniforms.u_cameraMatrix.value.copy(virtualCamera.matrixWorld);
            
            composer.render();
        }

        animate();

        // --- RESIZE HANDLER ---
        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;
            
            renderer.setSize(width, height);
            composer.setSize(width, height);
            
            // Update virtual camera aspect ratio
            virtualCamera.aspect = width / height;
            virtualCamera.updateProjectionMatrix();
            
            uniforms.u_resolution.value.set(width, height);
        });
    </script>
</body>
</html>
