<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Hole</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.4);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 14px;
            letter-spacing: 1px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="info">website in progress...</div>
    
    <!-- Import Maps Polyfill for ES Modules -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // 1. SCENE SETUP
        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        // Orthographic camera for a fullscreen shader quad
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 10);
        camera.position.z = 1;

        // 2. SHADERS
        const vertexShader = `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = vec4(position, 1.0);
            }
        `;

        const fragmentShader = `
            uniform float u_time;
            uniform vec2 u_resolution;
            varying vec2 vUv;

            // --- Math & Procedural Noise Functions ---
            mat2 rot(float a) {
                float s = sin(a), c = cos(a);
                return mat2(c, -s, s, c);
            }

            float hash(float n) { return fract(sin(n)*43758.5453123); }
            
            float noise(vec3 x) {
                vec3 p = floor(x);
                vec3 f = fract(x);
                f = f*f*(3.0-2.0*f);
                float n = p.x + p.y*57.0 + 113.0*p.z;
                return mix(
                    mix(mix(hash(n+0.0), hash(n+1.0),f.x), mix(hash(n+57.0), hash(n+58.0),f.x),f.y),
                    mix(mix(hash(n+113.0), hash(n+114.0),f.x), mix(hash(n+170.0), hash(n+171.0),f.x),f.y),
                f.z);
            }

            // Fractional Brownian Motion (creates the wispy gas look)
            float fbm(vec3 p) {
                float f = 0.0;
                f += 0.5000*noise(p); p = p*2.02;
                f += 0.2500*noise(p); p = p*2.03;
                f += 0.1250*noise(p); p = p*2.01;
                f += 0.0625*noise(p);
                return f / 0.9375;
            }

            void main() {
                // Normalize pixel coordinates
                vec2 uv = (vUv - 0.5) * 2.0;
                uv.x *= u_resolution.x / u_resolution.y;

                // Ray origin (camera position) and direction
                vec3 ro = vec3(0.0, 0.8, -5.0);
                vec3 rd = normalize(vec3(uv, 1.0));
                
                // Tilt the camera down slightly for a better view of the disk
                rd.yz *= rot(0.2);
                ro.yz *= rot(0.2);

                // Black Hole Properties
                float mass = 0.5;
                float rs = 2.0 * mass; // Schwarzschild radius (Event Horizon)
                
                vec3 p = ro;
                vec3 v = rd;
                float dt = 0.02; // Raymarching step size
                
                vec3 col = vec3(0.0);
                float diskAccum = 0.0;
                
                // --- CORE RAYMARCHING LOOP ---
                for(int i = 0; i < 250; i++) {
                    float r = length(p);
                    
                    // 1. Caught in Event Horizon (Absolute Black)
                    if(r < rs * 0.95) {
                        col *= 0.0;
                        break;
                    }
                    
                    // 2. Escaped to deep space (Draw Starfield Background)
                    if(r > 15.0) {
                        // Stars are drawn using the heavily bent velocity vector (v)
                        float stars = pow(max(0.0, noise(v * 150.0)), 15.0) * 1.5;
                        stars += pow(max(0.0, noise(v * 250.0)), 20.0) * 0.8;
                        
                        // Subtle galactic background glow
                        float galaxy = noise(v * 5.0) * 0.1;
                        col += vec3(stars) + vec3(galaxy * 0.5, galaxy * 0.7, galaxy);
                        break;
                    }
                    
                    // 3. Gravitational Lensing (Bending the light ray)
                    vec3 gravityDir = -normalize(p);
                    vec3 force = gravityDir * (mass / (r * r));
                    
                    v = normalize(v + force * dt * 1.5); // Bends the velocity
                    p += v * dt; // Move forward
                    
                    // 4. Volumetric Accretion Disk (Equatorial Gas)
                    float diskThickness = 0.15;
                    if(abs(p.y) < diskThickness && r > rs * 1.2 && r < 5.0) {
                        float distToCenter = length(p.xz);
                        
                        // Orbital mechanics (closer to hole = spins faster)
                        float angle = atan(p.z, p.x);
                        float speed = sqrt(mass / distToCenter) * 1.5; 
                        angle -= u_time * speed * 0.5;
                        
                        vec3 diskPos = vec3(cos(angle)*distToCenter, 0.0, sin(angle)*distToCenter);
                        
                        // Noise Turbulence
                        float n = fbm(diskPos * 3.5 - vec3(0.0, u_time*0.1, 0.0));
                        
                        // Shaping the disk (fading out at edges and top/bottom)
                        float verticalFade = smoothstep(diskThickness, 0.0, abs(p.y));
                        float radialFade = smoothstep(5.0, 3.0, distToCenter) * smoothstep(rs*1.2, rs*2.0, distToCenter);
                        
                        // Doppler Beaming (Relativistic brightness shift)
                        // Gas moving towards you is brighter, moving away is dimmer
                        vec3 tangent = normalize(vec3(-diskPos.z, 0.0, diskPos.x));
                        float doppler = max(0.0, 1.0 + dot(v, tangent) * 1.2);
                        
                        float density = n * verticalFade * radialFade * doppler;
                        diskAccum += max(0.0, density * dt * 2.5);
                    }
                    
                    // Adaptive step size (move faster through empty space to save GPU)
                    dt = max(0.015, 0.02 * r);
                }
                
                // Color mapping for the disk (Orange/Gold core, cooler edges)
                vec3 hotColor = vec3(1.0, 0.7, 0.3);
                vec3 coolColor = vec3(0.8, 0.3, 0.1);
                
                vec3 finalDiskColor = mix(coolColor, hotColor, min(1.0, diskAccum * 0.5));
                col += finalDiskColor * diskAccum * 1.5;

                gl_FragColor = vec4(col, 1.0);
            }
        `;

        // 3. MATERIAL & MESH
        const uniforms = {
            u_time: { value: 0.0 },
            u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
        };

        const material = new THREE.ShaderMaterial({
            vertexShader,
            fragmentShader,
            uniforms
        });

        // The entire scene is just one flat square covering the screen
        const plane = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
        scene.add(plane);

        // 4. POST-PROCESSING (Cinematic Bloom)
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));

        // UnrealBloomPass parameters: resolution, strength, radius, threshold
        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            1.2, // Strength of the glow
            0.5, // Radius of the glow
            0.6  // Threshold (only bloom bright pixels)
        );
        composer.addPass(bloomPass);

        // 5. ANIMATION LOOP
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            uniforms.u_time.value = clock.getElapsedTime();
            composer.render();
        }

        animate();

        // 6. RESIZE HANDLER
        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;
            renderer.setSize(width, height);
            composer.setSize(width, height);
            uniforms.u_resolution.value.set(width, height);
        });
    </script>
</body>
</html>
